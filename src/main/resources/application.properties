# 每日香港好去處 — application config
# Render 會派 PORT 環境變數；本地預設 8080
server.port=${PORT:8080}

# Neon Postgres（JDBC URL 格式）。
# Neon 俾你嗰條係 postgresql://USER:PASSWORD@HOST/DB?sslmode=require，
# 要轉做 JDBC 格式：
#   DATABASE_URL=jdbc:postgresql://HOST:5432/DB?sslmode=require
#   DB_USER=USER
#   DB_PASSWORD=PASSWORD
# 三個環境變數缺一不可，否則起唔到機。
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 開發時關掉 template cache；production 可轉 true
spring.thymeleaf.cache=false

# ---- Phase 2: Admin CMS ----
# CMS 登入帳號（必填！冇設呢兩個，開機即炒，唔好用預設密碼）
# ADMIN_USERNAME=admin
# ADMIN_PASSWORD=change-me-please
#
# Cloudinary 圖片上傳（選填）。
# 去 cloudinary.com console → Dashboard 攞條 CLOUDINARY_URL，
# 格式：cloudinary://API_KEY:API_SECRET@CLOUD_NAME
# 唔設嘅話 /api/admin/upload 會回 503，CMS 可以照用人手貼圖片 URL。
# CLOUDINARY_URL=
#
# 上傳圖片大小上限（Cloudinary 免費版單檔 10MB）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
