# 每日香港好去處 — application config
# Render 會派 PORT 環境變數；本地預設 8080
server.port=${PORT:8080}

# Neon Postgres（JDBC URL 格式）。
# Neon 俾你嗰條係 postgresql://USER:PASSWORD@HOST/DB?sslmode=require，
# 要轉做 JDBC 格式：
#   DATABASE_URL=jdbc:postgresql://HOST:5432/DB?sslmode=require
#   DB_USER=USER
#   DB_PASSWORD=PASSWORD
# 三個環境變數缺一不可，否則起唔到機。
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 開發時關掉 template cache；production 可轉 true
spring.thymeleaf.cache=false

# ---- Phase 2: Admin CMS ----
# CMS 管理員帳號係 DB-backed（admin_users 表），密碼 BCrypt 加密儲存。
# ADMIN_USERNAME / ADMIN_PASSWORD 只係一次性 bootstrap：
# admin_users 表空嘅時候（第一次 deploy），開機就會用呢兩個自動建立第一位管理員；
# 建立咗之後可以喺 Render 刪走呢兩個 env，之後喺 CMS「管理員」頁新增／刪除／改密碼。
# （唔好將密碼 commit 入 repo。）
# ADMIN_USERNAME=Tom
# ADMIN_PASSWORD=
#
# Cloudinary 圖片上傳（選填）。
# 去 cloudinary.com console → Dashboard 攞條 CLOUDINARY_URL，
# 格式：cloudinary://API_KEY:API_SECRET@CLOUD_NAME
# 唔設嘅話 /api/admin/upload 會回 503，CMS 可以照用人手貼圖片 URL。
# CLOUDINARY_URL=
#
# 上傳圖片大小上限（Cloudinary 免費版單檔 10MB）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
