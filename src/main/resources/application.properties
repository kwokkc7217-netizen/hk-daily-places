# 每日香港好去處 — application config
# Render 會派 PORT 環境變數；本地預設 8080
server.port=${PORT:8080}

# Neon Postgres（JDBC URL 格式）。
# Neon 俾你嗰條係 postgresql://USER:PASSWORD@HOST/DB?sslmode=require，
# 要轉做 JDBC 格式：
#   DATABASE_URL=jdbc:postgresql://HOST:5432/DB?sslmode=require
#   DB_USER=USER
#   DB_PASSWORD=PASSWORD
# 三個環境變數缺一不可，否則起唔到機。
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 開發時關掉 template cache；production 可轉 true
spring.thymeleaf.cache=false
