<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" th:content="${pageDesc} ?: '每日香港好去處：精選香港行山徑、購物熱點同電影推介，每日更新。'">
  <meta name="google-adsense-account" content="ca-pub-4257803181954368">
  <meta name="google-site-verification" content="oCNz2EhszGAICA7NkP9zbCwJBvzLSqNJ56Nzc86qCRg" />
  <title th:text="(${pageTitle} ?: '首頁') + '｜每日香港好去處'">每日香港好去處</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4257803181954368" crossorigin="anonymous"></script>
  <!-- GA4：GA4_MEASUREMENT_ID 未設就不輸出，唔影響頁面同 AdSense 審批 -->
  <th:block th:if="${ga4Id != null and !#strings.isEmpty(ga4Id)}">
    <script async th:src="@{'https://www.googletagmanager.com/gtag/js?id=' + ${ga4Id}}"></script>
    <script th:inline="javascript">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', /*[[${ga4Id}]]*/ 'G-PLACEHOLDER');
    </script>
  </th:block>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif; margin: 0; color: #222; line-height: 1.75; background: #fafafa; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px; }
    header.site { background: #14532d; color: #fff; }
    header.site .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding-top: 12px; padding-bottom: 12px; }
    .brand { color: #fff; text-decoration: none; font-size: 1.35em; font-weight: 700; }
    nav.main a { color: #d1fae5; text-decoration: none; margin-left: 18px; font-size: 1.02em; }
    nav.main a:hover { color: #fff; text-decoration: underline; }
    .sitesearch { display: flex; margin-left: 18px; }
    .sitesearch input { border: 1px solid #d1fae5; border-radius: 999px 0 0 999px; padding: 5px 12px; font-size: .9em; width: 120px; background: #fff; color: #222; }
    .sitesearch input:focus { outline: none; width: 160px; }
    .sitesearch button { border: 1px solid #d1fae5; border-left: 0; border-radius: 0 999px 999px 0; background: #d1fae5; color: #14532d; padding: 5px 10px; cursor: pointer; font-size: .9em; }
    .searchform { display: flex; gap: 8px; margin-top: 12px; }
    .searchform input { flex: 1; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 12px; font-size: 1em; }
    .searchform button { background: #14532d; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font-size: 1em; cursor: pointer; }
    .state { color: #888; text-align: center; padding: 24px 0; }
    main { padding-top: 8px; padding-bottom: 32px; }
    .hero { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 20px 22px; margin: 18px 0 24px; }
    .hero h1 { margin: 0 0 6px; font-size: 1.6em; }
    .hero p { margin: 0; color: #555; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 180px; object-fit: cover; display: block; background: #eee; }
    .card-body { padding: 14px 16px 16px; }
    .badge { display: inline-block; background: #15803d; color: #fff; font-size: .82em; padding: 2px 10px; border-radius: 12px; margin-bottom: 8px; }
    .pubdate { color: #888; font-size: .85em; margin: 0 0 6px; }
    .card h2 { font-size: 1.15em; margin: 0 0 6px; line-height: 1.4; }
    .card h2 a { color: #222; text-decoration: none; }
    .card h2 a:hover { color: #15803d; }
    .card p { margin: 0; color: #555; font-size: .95em; }
    article.place h1 { font-size: 1.7em; line-height: 1.4; margin: .4em 0 .2em; }
    .meta { color: #888; font-size: .9em; margin: 0 0 1em; }
    .hero-img { width: 100%; border-radius: 10px; margin: 8px 0 4px; background: #eee; }
    .desc { white-space: pre-line; margin: 1em 0; }
    .desc p { margin: .7em 0; }
    h2.section { font-size: 1.25em; margin: 1.6em 0 .5em; border-left: 5px solid #15803d; padding-left: 10px; }
    iframe.map { width: 100%; height: 380px; border: 1px solid #ddd; border-radius: 10px; }
    .video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; }
    .video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .back { margin-top: 24px; }
    .back a { color: #15803d; }
    .adwrap { margin: 20px 0; text-align: center; }
    .adlabel { display: block; font-size: .75em; color: #aaa; letter-spacing: 2px; }
    footer.site { border-top: 1px solid #ddd; color: #888; font-size: .88em; padding: 18px 0 28px; margin-top: 24px; }
    .notfound { text-align: center; padding: 60px 0; }
    .notfound h1 { font-size: 2em; }
    .sortbar { display: flex; gap: 8px; margin: 0 0 16px; }
    .sortbar a { padding: 6px 14px; border: 1px solid #d1d5db; border-radius: 999px; color: #374151; text-decoration: none; font-size: 0.92em; background: #fff; }
    .sortbar a.active { background: #14532d; border-color: #14532d; color: #fff; }
    .pagination { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 28px 0 8px; }
    .pagination a, .pagination span { min-width: 34px; text-align: center; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 8px; color: #374151; text-decoration: none; background: #fff; font-size: 0.92em; }
    .pagination span.current { background: #14532d; border-color: #14532d; color: #fff; font-weight: 700; }
    .branches { list-style: none; padding: 0; }
    .branches li { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
    .branches li strong { display: block; }
    .branches li a { color: #15803d; font-size: .9em; }
  </style>
</head>
<body>
  <header class="site" th:fragment="header">
    <div class="wrap">
      <a class="brand" href="/">每日香港好去處</a>
      <nav class="main">
        <a href="/">首頁</a>
        <a href="/category/hiking">行山</a>
        <a href="/category/shopping">購物</a>
        <a href="/category/movie">睇戲</a>
        <a href="/category/food">食乜嘢？</a>
        <a href="https://articles-f7vq.onrender.com/" target="_blank" rel="noopener">每日一篇</a>
      </nav>
      <form class="sitesearch" action="/search" method="get">
        <input type="search" name="q" placeholder="搜尋…" aria-label="搜尋" minlength="2" required>
        <button type="submit" aria-label="搜尋">🔍</button>
      </form>
    </div>
  </header>

  <div class="adwrap" th:fragment="adTop">
    <span class="adlabel">廣告</span>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4257803181954368" data-ad-slot="5989561290" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="adwrap" th:fragment="adArticle">
    <span class="adlabel">廣告</span>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4257803181954368" data-ad-slot="6627855548" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <footer class="site" th:fragment="footer">
    <div class="wrap">
      <p>© 2026 每日香港好去處 ｜ 發現香港每日好去處：行山、購物、睇戲</p>
    </div>
  </footer>
</body>
</html>
