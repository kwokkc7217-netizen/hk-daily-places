<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<div th:replace="~{layout :: adTop}"></div>
<main class="wrap">
  <article class="place">
    <span class="badge" th:text="${place.category.displayName}">分類</span>
    <h1 th:text="${place.title}">標題</h1>
    <p class="meta" th:if="${place.publishedAt != null}" th:text="${#temporals.format(place.publishedAt, 'yyyy-MM-dd')}">日期</p>
    <img class="hero-img" th:if="${not #strings.isEmpty(place.imageUrl)}" th:src="${place.imageUrl}" th:alt="${place.title}">
    <div class="desc" th:text="${place.description}">內文</div>

    <div th:replace="~{layout :: adArticle}"></div>

    <div th:if="${not #lists.isEmpty(locations)}">
      <h2 class="section">分店一覽</h2>
      <div th:if="${not #lists.isEmpty(markers) and not #strings.isEmpty(mapsApiKey)}">
        <div id="branch-map" style="width:100%;height:380px;border:1px solid #ddd;border-radius:10px;"></div>
        <script th:inline="javascript">
          var branchMarkers = /*[[${markers}]]*/ [];
          function initBranchMap() {
            var map = new google.maps.Map(document.getElementById('branch-map'), {
              zoom: 11, center: {lat: 22.3193, lng: 114.1694}
            });
            var bounds = new google.maps.LatLngBounds();
            var info = new google.maps.InfoWindow();
            branchMarkers.forEach(function(m) {
              var pos = {lat: m.lat, lng: m.lng};
              var marker = new google.maps.Marker({position: pos, map: map, title: m.name});
              bounds.extend(pos);
              marker.addListener('click', function() {
                var div = document.createElement('div');
                var st = document.createElement('strong');
                st.textContent = m.name;
                div.appendChild(st);
                div.appendChild(document.createElement('br'));
                div.appendChild(document.createTextNode(m.address));
                info.setContent(div);
                info.open(map, marker);
              });
            });
            if (branchMarkers.length > 1) { map.fitBounds(bounds); }
            else if (branchMarkers.length === 1) { map.setCenter({lat: branchMarkers[0].lat, lng: branchMarkers[0].lng}); map.setZoom(15); }
          }
        </script>
        <script async defer th:src="@{'https://maps.googleapis.com/maps/api/js?key=' + ${mapsApiKey} + '&callback=initBranchMap'}"></script>
      </div>
      <ul class="branches">
        <li th:each="loc : ${locations}">
          <strong th:text="${loc.branchName}">分店</strong>
          <span th:text="${loc.address}">地址</span><br>
          <a th:href="@{https://www.google.com/maps/search/(api=1,query=${loc.branchName + ' ' + loc.address})}" target="_blank" rel="noopener">在 Google Maps 開啟</a>
        </li>
      </ul>
    </div>

    <div th:if="${#lists.isEmpty(locations) and not #strings.isEmpty(place.mapQuery)}">
      <h2 class="section">地圖</h2>
      <iframe class="map" th:src="@{https://maps.google.com/maps(q=${place.mapQuery},output='embed')}" loading="lazy" title="地圖"></iframe>
    </div>

    <div th:if="${not #strings.isEmpty(place.youtubeId)}">
      <h2 class="section">影片介紹</h2>
      <div class="video">
        <iframe th:src="'https://www.youtube-nocookie.com/embed/' + ${place.youtubeId}" title="YouTube 影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>

    <div th:if="${not #lists.isEmpty(relatedPlaces)}">
      <h2 class="section">你可能都鍾意</h2>
      <ul class="related">
        <li th:each="rel : ${relatedPlaces}">
          <a th:href="@{/place/{slug}(slug=${rel.slug})}" th:text="${rel.title}">標題</a>
          <span class="badge" th:text="${rel.category.displayName}">分類</span>
        </li>
      </ul>
    </div>

    <p class="back"><a th:href="@{/category/{name}(name=${#strings.toLowerCase(place.category.name())})}">← 更多<span th:text="${place.category.displayName}">分類</span>好去處</a></p>
  </article>
</main>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
