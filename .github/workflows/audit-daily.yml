name: content-audit-daily

# Daily content audit — two independent jobs, same schedule.
#
# Job `audit` (deterministic checks only — no LLM calls): every day at
# 11:00 HKT it scores the posts that are due — never checked
# (audit_score IS NULL) or last checked at least 30 days ago
# (--only-due, --rescore-days 30) — and writes audit_score /
# audit_status / audited_at. All PUBLISHED articles are loaded every run
# because the TF-IDF duplicate matrix needs the full corpus, but only
# due posts are scored and written back.
#
# Job `llm-audit` (Gemini + Groq APIs, alternating, free tier): the same
# due-selection, but for qualitative LLM scores — never LLM-scored
# (audit_llm_score IS NULL) or last LLM-scored at least 30 days ago —
# and writes audit_llm_score / audit_llm_at. It scores every due post
# per run (no cap since 2026-11-14: the runs proved the free-tier limit
# is 10 RPM, not daily, and 6s spacing stays under it). Since
# 2026-11-14 the run alternates Gemini and Groq call by call with a 3s
# gap (each provider then sees a call every 6s), roughly doubling
# throughput; if one provider's quota dies mid-run it is disabled and
# the other carries on, so the run only stops when both are gone.
# It needs the repo secrets GEMINI_API_KEY and GROQ_API_KEY
# (Settings -> Secrets and variables -> Actions) and the EC2 rebuild
# must have created audit_llm_score / audit_llm_at first (the script
# checks and refuses to run without them). If only one key is set the
# run is single-provider at 6s spacing. The two jobs are independent
# and write different columns; either may fail without affecting the
# other.
on:
  schedule:
    - cron: '0 3 * * *'   # 11:00 HKT daily (avoids the recommender's 02:00/14:00 UTC runs)
  workflow_dispatch:
    inputs:
      write_scores:
        description: 'Write scores back to places (audit_score/audit_status/audited_at for the deterministic job; audit_llm_score/audit_llm_at for the LLM job).'
        required: false
        default: false
        type: boolean

# Stream Python output live: without this, Python buffers stdout when
# piped (as in Actions logs) and a long run looks stalled — nothing
# appears until the buffer fills or the script ends. The llm_audit.py
# log() helper also flushes per line; this covers audit.py too.
env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install scikit-learn psycopg2-binary
      - name: Run daily audit
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write_scores }}" = "true" ]; then
            python tools/audit/audit.py --check-images --check-live --only-due --write-scores
          else
            python tools/audit/audit.py --check-images --check-live --only-due
          fi
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit-report
          path: tools/audit/output/
          retention-days: 90

  llm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install psycopg2-binary
      - name: Run LLM audit
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write_scores }}" = "true" ]; then
            python tools/audit/llm_audit.py --only-due --write-scores
          else
            python tools/audit/llm_audit.py --only-due
          fi
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload LLM audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit-llm-report
          path: tools/audit/output-llm/
          retention-days: 90
