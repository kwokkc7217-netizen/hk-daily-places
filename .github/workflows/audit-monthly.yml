name: content-audit-monthly

# Lean monthly content audit (deterministic checks only — no LLM calls).
# Runs the audit script, uploads the report as an artifact.
# Staging note: the scheduled run is REPORT-ONLY (no --write-scores),
# because the audit_score/audit_status/audited_at columns only exist after
# the EC2 rebuild (Place.java gained the fields in cea6c90). Once the
# columns are confirmed live, flip the scheduled step to --write-scores.
# Manual runs can already write scores back via the workflow_dispatch
# input below — only after the rebuild.
on:
  schedule:
    - cron: '0 3 1 * *'   # 11:00 HKT on the 1st of each month
  workflow_dispatch:
    inputs:
      write_scores:
        description: 'Write scores back to places (audit_score/audit_status/audited_at). Only after the EC2 rebuild created the columns.'
        required: false
        default: false
        type: boolean

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install scikit-learn psycopg2-binary
      - name: Run monthly audit
        run: |
          if [ "${{ inputs.write_scores }}" = "true" ]; then
            python tools/audit/audit.py --check-images --check-live --write-scores
          else
            python tools/audit/audit.py --check-images --check-live
          fi
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit-report
          path: tools/audit/output/
          retention-days: 90
